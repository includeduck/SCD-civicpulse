# CivicPulse, local development stack.
#
#   cp .env.example .env
#   docker compose up --build
#
# Frontend http://localhost:8080 · API docs http://localhost:8000/docs
#
# Production uses compose.prod.yaml: prebuilt images tagged by commit SHA, no
# build:, no source mount, and no published backend, database or cache port.
#
# Networks (assignment §3.2):
#   edge      frontend <-> backend (and the one-shot model download)
#   internal  backend <-> postgres, redis, ollama; `internal: true`, so nothing
#             on it can reach the internet
# The backend is the only service on both. The frontend has no route to the
# database: see docs/evidence/network-isolation.txt.

name: civicpulse

x-backend-build: &backend-build
  build: ./backend
  image: civicpulse/backend:dev

x-backend-env: &backend-env
  # Built from POSTGRES_* so the password lives in exactly one place (.env).
  # Service names, never localhost: each container's localhost is itself.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: http://ollama:11434
  LOG_FORMAT: json

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      internal:
        aliases: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    # AOF persistence: rate-limit windows and cached AI answers survive a restart
    # (docs/ENGINEERING-NOTES.md, "Why the cache needs a volume").
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # One-shot: migrations and the idempotent seed, run once before any backend
  # starts. Never in the backend's own startup, where replicas would race.
  migrate:
    <<: *backend-build
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_db"]
    environment: *backend-env
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  backend:
    <<: *backend-build
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}   # CI points this at its own file; see scripts/ci_integration.sh
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For only from the frontend's nginx (its fixed address
      # below), so the rate limiter sees real client IPs and nobody else can
      # spoof one (ADR 0002).
      FORWARDED_ALLOW_IPS: 172.30.10.10
    # Development only: the host's source, mounted read-only, with hot reload.
    # Deliberately absent from compose.prod.yaml, which runs exactly the
    # image that was built, scanned and tagged.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "app", "--no-proxy-headers", "--no-access-log"]
    volumes:
      - ./backend/app:/app/app:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"  # dev convenience: /docs and /metrics
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status != 200)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    build: ./frontend
    image: civicpulse/frontend:dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      edge:
        ipv4_address: 172.30.10.10
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # ── Ollama (profile "ollama", on by default via COMPOSE_PROFILES in .env) ──
  # The model server itself sits on `internal` only: it never needs the
  # internet at runtime. The weights are fetched once by this one-shot service,
  # the only thing allowed out, into the shared ollama_models volume.
  ollama-pull:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    profiles: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ollama_models:/root/.ollama
    networks: [edge]
    restart: "no"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }

  ollama:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    profiles: [ollama]
    restart: unless-stopped
    # Start the server, load the model once so the first complaint doesn't pay
    # the cold start, and keep it loaded (OLLAMA_KEEP_ALIVE=-1). SIGTERM is
    # passed on to the server.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama run "$$OLLAMA_MODEL" "Reply with OK" >/dev/null
        wait $$pid
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    # Healthy only once the model is loaded in memory, i.e. warm.
    healthcheck:
      test: ["CMD-SHELL", "ollama ps | grep -q \"$${OLLAMA_MODEL}\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 3G }

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:         # PostgreSQL data directory: the system of record
  redisdata:      # Redis AOF: rate-limit windows and cached AI answers survive restarts
  ollama_models:  # model weights, so ~1.3 GB isn't downloaded again on every `up`
