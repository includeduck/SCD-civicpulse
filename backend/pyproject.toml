[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse municipal complaint intake and AI triage backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "python-multipart==0.0.18",
    "python-jose[cryptography]==3.3.0",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "greenlet>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-redis==4.6.0.20241004",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = ["S101", "E501"]  # allow assert in tests and long string literals in seed data

[tool.ruff.lint.isort]
# backend/alembic/ (migrations dir) makes ruff treat the alembic package as first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -q"

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]
