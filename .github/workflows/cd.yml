# Continuous delivery (assignment §3.4): every push to main is tested again,
# published to GHCR, and deployed to a throwaway Kubernetes cluster where it
# must pass a smoke test. Each stage runs only if the one before succeeded
# (`needs:`), so a broken commit is never published and never deployed.
#
#   test ──> build-push ──> deploy-k8s
#
# Deployed by immutable reference: <image>:<commit sha>@<digest> (ADR 0003).
# :latest is pushed for convenience and never deployed.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run a deploy by hand, e.g. to show it again on video

# Least privilege by default; the two jobs that need more ask for it.
permissions:
  contents: read

# Deploys queue behind each other; one is never cancelled halfway.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io/includeduck/scd-civicpulse
  SYFT_IMAGE: anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0

jobs:
  # The full CI suite again (lint, tests with PostgreSQL, image build, Trivy,
  # manifests, Compose integration), on the merged result.
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    name: build-push
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to this repository's GHCR packages, nothing else
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # GITHUB_TOKEN: scoped to this repository, expires with the job. No
      # personal token or account password anywhere.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # A software bill of materials for exactly what was pushed (by digest).
      - name: SBOM with Syft
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for image in backend frontend; do
            digest_var="${image^^}_DIGEST"
            docker run --rm \
              -v "$HOME/.docker/config.json:/config/config.json:ro" -e DOCKER_CONFIG=/config \
              -v "$RUNNER_TEMP/sbom:/out" "$SYFT_IMAGE" \
              scan "registry:$REGISTRY/$image@${!digest_var}" -o "spdx-json=/out/$image.spdx.json"
          done
          ls -l "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom/*.spdx.json
          retention-days: 90

      - name: Summary
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo "### Published \`${GITHUB_SHA}\`"
            echo ""
            echo "| Image | Deployable reference |"
            echo "|---|---|"
            echo "| backend | \`$REGISTRY/backend:$GITHUB_SHA@$BACKEND_DIGEST\` |"
            echo "| frontend | \`$REGISTRY/frontend:$GITHUB_SHA@$FRONTEND_DIGEST\` |"
            echo ""
            echo "\`:latest\` also points here; it is never deployed."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-k8s:
    name: deploy-k8s
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the images just published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install k3d (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/k3d" "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_SHA256  $RUNNER_TEMP/k3d" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          k3d version
      # Ephemeral k3d cluster from k8s/k3d-cluster.yaml, prod overlay pinned to
      # this commit's SHA and digests, then the Ingress smoke test and HPA.
      - name: Deploy and smoke-test
        env:
          IMAGE_SHA: ${{ github.sha }}
          BACKEND_DIGEST: ${{ needs.build-push.outputs.backend-digest }}
          FRONTEND_DIGEST: ${{ needs.build-push.outputs.frontend-digest }}
          CREATE_CLUSTER: "1"
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # optional; without it the deploy uses the rules
        run: bash scripts/cd_deploy.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n civicpulse get all,events --sort-by=.lastTimestamp || true
          kubectl -n civicpulse describe pods || true
          kubectl -n civicpulse logs deploy/backend --all-containers --tail=100 || true
          kubectl -n civicpulse logs job/migrate --all-containers --tail=100 || true
