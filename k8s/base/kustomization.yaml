apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything in civicpulse, never default.
namespace: civicpulse

labels:
  - pairs:
      app.kubernetes.io/part-of: civicpulse
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - network-policy.yaml
  - pdb.yaml
  - hpa.yaml
