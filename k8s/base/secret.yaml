# PLACEHOLDERS ONLY. Never commit a real credential here, not even base64
# encoded: base64 is an encoding, not encryption.
#
# - Dev overlay: uses these placeholders as-is on a throwaway local cluster.
# - Prod overlay: deletes this object, so a deploy can never overwrite the
#   real Secret. CD creates it from GitHub Secrets instead (Phase 14):
#     kubectl -n civicpulse create secret generic backend-secrets \
#       --from-literal=POSTGRES_PASSWORD=... --from-literal=GROQ_API_KEY=... \
#       --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-local-only
  GROQ_API_KEY: ""
