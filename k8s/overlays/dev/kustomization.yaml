# Local k3d cluster: images built on this machine and imported with
# `k3d image import` (scripts/k8s-up.sh), simulated triage, sample data.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/includeduck/scd-civicpulse/backend
    newTag: dev
  - name: ghcr.io/includeduck/scd-civicpulse/frontend
    newTag: dev

patches:
  - target: { kind: ConfigMap, name: backend-config }
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: development
      - op: replace
        path: /data/TRIAGE_PROVIDER
        value: simulated
  # Images are imported into k3d, never pulled: if an import is missing, fail
  # loudly (ErrImageNeverPull) rather than fetch something from a registry.
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Never
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: { kind: Job, name: migrate }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  # Dev also loads the idempotent sample data, so the dashboard isn't empty.
  - target: { kind: Job, name: migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_db"]
